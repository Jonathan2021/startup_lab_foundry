name: Foundry image delivery

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the candidate image (default: validate only)"
        required: true
        default: false
        type: boolean

      target_environment:
        description: "Environment used for publication"
        required: false
        type: environment

  schedule:
    # Weekly and off the top of the hour to limit cost and scheduler congestion.
    - cron: "17 4 * * 1"

permissions: {}

jobs:
  validate:
    if: >
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && !inputs.publish)

    permissions:
      contents: read

    uses: ./.github/workflows/reusable-image-delivery.yml
    with:
      candidate: validate-${{ github.run_id }}
      publish: false

  publish:
    if: >
      github.event_name == 'workflow_dispatch' &&
      inputs.publish &&
      github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    uses: ./.github/workflows/reusable-image-delivery.yml
    with:
      candidate: release-${{ github.run_id }}
      publish: true
      target_environment: ${{ inputs.target_environment }}
