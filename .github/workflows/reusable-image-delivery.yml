name: Reusable Foundry image delivery

on:
  workflow_call:
    inputs:
      candidate:
        description: "Candidate tag for the image"
        required: false
        type: string
      publish:
        required: true
        type: boolean
        default: false
      target_environment:
        description: "Required only when publishing"
        required: false
        type: string

    outputs:
      image_name:
        description: "The image name that was built (and eventually published)"
        value: ${{ jobs.image.outputs.image-ref }}
      image_immutable:
        description: "Immutable published image reference; empty when publish=false"
        value: ${{ jobs.publish.outputs.image-immutable}}

jobs:
  image:
    name: Image and Compose contract
    runs-on: ubuntu-latest
    timeout-minutes: 20


    permissions: {"contents": "read"}

    env:
      UV_VERSION: "0.12.4"
      CI_PYTHON_VERSION: "3.13"

    outputs:
      image-ref: ${{ steps.release-metadata.outputs.image-ref }}
      image-name: ${{ steps.release-metadata.outputs.normalized-image-name }}

    steps:
      - name: Check out the tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      
      - name: normalize release metadata
        id: release-metadata
        uses: ./.github/actions/release-metadata
        with:
          candidate-tag: ${{ inputs.candidate }}
          image-name: ghcr.io/${{ github.repository_owner }}/foundry
      
      - name: Build the runtime image
        id: build
        env:
          IMAGE_NAME: "${{ steps.release-metadata.outputs.image-ref }}"
        run: |
          docker build --pull --tag "$IMAGE_NAME" .

      - name: Verify the non-root runtime identity
        env:    
          IMAGE_NAME: ${{ steps.release-metadata.outputs.image-ref }}
        run: test "$(docker run --rm --entrypoint id "${IMAGE_NAME}" -u)" = "10001"

      - name: Verify the CLI entry point
        env:    
          IMAGE_NAME: ${{ steps.release-metadata.outputs.image-ref }}
        run: docker run --rm "$IMAGE_NAME" --help

      - name: Install uv and Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.CI_PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock
          # Restore the quality-owned cache without racing its post-job save.
          save-cache: false
          prune-cache: true

      - name: Install development dependencies
        run: uv sync --locked --group dev

      - name: Test the container stack
        run: >-
          uv run pytest tests/acceptance/test_container_stack.py
          --junitxml=container-results.xml

      - name: Upload container evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: container-attempt-${{ github.run_attempt }}
          path: container-results.xml
          if-no-files-found: warn
          retention-days: 5
    
      - name: Save tested image
        if: ${{ inputs.publish }}
        env:
          IMAGE_NAME: ${{ steps.release-metadata.outputs.image-ref }}
        run: docker save "$IMAGE_NAME" -o foundry-image.tar

      - name: Upload tested image
        if: ${{ inputs.publish }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: foundry-image
          path: foundry-image.tar
          retention-days: 1

  validate-publish-request:
    name: Validate publication request
    if: ${{ inputs.publish }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions: {}

    steps:
      - name: Require target environment
        shell: bash
        env:
          TARGET_ENVIRONMENT: ${{ inputs.target_environment }}
        run: |
          set -euo pipefail

          if [[ -z "$TARGET_ENVIRONMENT" ]]; then
            echo "::error::target_environment is required when publish=true"
            exit 1
          fi
  
  publish:
    name: Publish Foundry image
    if: ${{ inputs.publish }}
    needs:
      - image
      - validate-publish-request

    runs-on: ubuntu-latest

    environment: ${{ inputs.target_environment }}

    outputs:
      image-immutable: "${{ needs.image.outputs.image-name }}@${{ steps.push.outputs.digest }}"

    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
      artifact-metadata: write

    steps:
      - name: Download tested image
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c #v8.0.1
        with:
          name: foundry-image

      - name: Load tested image
        run: docker load --input foundry-image.tar
      
      - name: Login to GHCR
        if: ${{ inputs.publish }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish online
        id: push
        if: ${{ inputs.publish }}
        shell: bash
        env:    
          IMAGE_NAME: ${{ needs.image.outputs.image-ref }}
        run: |
          set -euo pipefail

          output="$(docker push "$IMAGE_NAME")"
          printf '%s\n' "$output"

          digest="$(printf '%s\n' "$output" |
            sed -n 's/.*digest: \(sha256:[0-9a-f]\{64\}\).*/\1/p' |
            tail -n 1)"

          test -n "$digest"
          echo "digest="$digest"" >> "$GITHUB_OUTPUT"
      
      - name: Provenance attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 #v4.2.2
        with:
          subject-name: ${{ needs.image.outputs.image-name }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true


      - name: Populate output
        env:    
          IMAGE_DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          echo "DIGEST="$IMAGE_DIGEST"" >> "$GITHUB_OUTPUT"

  
  check-all:
    needs: ["image", "publish"]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: ${{ always() }}

    permissions: {}

    steps:
      - name: Summary
        env:
          SHA: ${{ github.sha }}
          DIGEST: ${{ needs.publish.outputs.image-immutable || 'not published' }} 
          PUBLISH_MODE: ${{ inputs.publish }}
          IMAGE_NAME: ${{ needs.image.outputs.image-name }}
          CANDIDATE: ${{ inputs.candidate }}
          SUCCESS: ${{ needs.image.result == 'success' && (!inputs.publish || needs.publish.result == 'success') }}
        run: |
          echo "CANDIDATE: "$CANDIDATE"" >> "$GITHUB_STEP_SUMMARY" 
          echo "Publish mode: "$PUBLISH_MODE"" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit SHA: "$SHA"" >> "$GITHUB_STEP_SUMMARY"
          echo "IMAGE NAME: "$IMAGE_NAME"" >> "$GITHUB_STEP_SUMMARY"
          echo "IMMUTABLE IMAGE: "$DIGEST"" >> "$GITHUB_STEP_SUMMARY"
          echo "SUCCESS: "$SUCCESS"" >> "$GITHUB_STEP_SUMMARY"
      
      - name: Require every job
        env:
          IMAGE: ${{ needs.image.result }}
          PUBLISH: ${{ needs.publish.result }}
          PUBLISH_MODE: ${{ inputs.publish }}
        run: |
          echo "image: $IMAGE"
          echo "publish: $PUBLISH"

          test "$IMAGE" = "success"

          if [ "$PUBLISH_MODE" = "true" ]; then
            test "$PUBLISH" = "success"
          else
            test "$PUBLISH" = "skipped"
          fi