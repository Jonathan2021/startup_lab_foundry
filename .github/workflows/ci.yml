name: Foundry CI

on:
  push:
    branches:
      - main
      - 'releases/**'

  pull_request:
    branches:
      - main
      - 'releases/**'
permissions: {contents: read}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.4"
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          prune-cache: true

      - name: Verify lock file
        run: uv lock --check

      - name: Install the project
        run: uv sync --locked --all-extras --dev

      - name: Display Python version
        run: uv run python --version

      - name: Ruff
        run: uv run ruff check src/ tests/

      - name: mypy
        run: uv run mypy src/

      - name: Fast product and CI-contract tests
        run: >-
          uv run coverage run -m pytest
          tests/unit
          tests/integration
          tests/acceptance/test_cli_workspace.py
          tests/contract/test_package_boundary.py
          tests/contract/test_ci_workflow.py
          --junitxml=test-results.xml

      - name: Generate coverage report
        if: ${{ !cancelled() }}
        run: uv run coverage xml -o coverage.xml

      - name: Upload coverage evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-py${{ matrix.python-version }}
          path: |
            test-results.xml
            coverage.xml
          retention-days: 5

  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: foundry
          POSTGRES_PASSWORD: foundry
          POSTGRES_DB: foundry
        ports:
          - 5432
        options: >-
          --health-cmd "pg_isready -U foundry -d foundry"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure PostgreSQL URL
        run: |
          echo "FOUNDRY_DATABASE_URL=postgresql+psycopg://foundry:foundry@localhost:${{ job.services.postgres.ports['5432'] }}/foundry" >> "$GITHUB_ENV"

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.4"
          python-version: "3.13"
          enable-cache: true
          prune-cache: true

      - name: Verify lock file
        run: uv lock --check

      - name: Install the project
        run: uv sync --locked --all-extras --dev

      - name: Display Python version
        run: uv run python --version

      - name: Run migrations
        run: uv run alembic upgrade head

      - name: Run migration tests
        run: uv run pytest tests/unit/test_migrations.py

      - name: Adding a dummy venture for integration testing
        run: uv run foundry venture create --id test-venture --name "Test Venture" --objective "A test venture for integration testing." --stage "discovery"

      - name: Showing the dummy venture for integration testing
        run: uv run foundry venture show --id test-venture | grep -Fq "Test Venture"

  docker:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build image
        run: docker build -t foundry-ci .

      - name: Test non-root user
        run: docker run --rm --entrypoint id foundry-ci | grep -Fq "uid=10001(foundry)"

      - name: Test CLI
        run: docker run --rm foundry-ci --help

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.4"
          python-version: "3.13"

      - name: Install the project
        run: uv sync --locked --all-extras --dev

      - name: Display Python version
        run: uv run python --version

      - name: Run container-stack acceptance
        run: uv run pytest tests/acceptance/test_container_stack.py

  ci:
    name: ci
    needs: ["python-quality", "postgres-integration", "docker"]
    runs-on: ubuntu-latest
    if: ${{ always() }}

    steps:
      - name: Check required jobs
        env:
          PYTHON_QUALITY: ${{ needs.python-quality.result }}
          POSTGRES_INTEGRATION: ${{ needs.postgres-integration.result }}
          DOCKER: ${{ needs.docker.result }}
        run: |
          echo "python-quality: $PYTHON_QUALITY"
          echo "postgres-integration: $POSTGRES_INTEGRATION"
          echo "docker: $DOCKER"

          test "$PYTHON_QUALITY" = "success"
          test "$POSTGRES_INTEGRATION" = "success"
          test "$DOCKER" = "success"
