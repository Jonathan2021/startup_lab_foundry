name: Foundry CI

on:
  push:
    branches:
      - main
      - 'releases/**'
  pull_request:
    branches:
      - main
      - 'releases/**'
  
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.12.4"
  CI_PYTHON_VERSION: "3.13"

jobs:
  python-quality:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]

    steps:
      - name: Check out the tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and matrix Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: uv.lock
          prune-cache: true

      - name: Verify the dependency lock
        run: uv lock --check

      - name: Install development dependencies
        run: uv sync --locked --group dev

      - name: Show the selected Python version
        run: uv run python --version

      - name: Lint
        if: ${{ matrix.python-version == '3.13' }}
        run: uv run ruff check src tests

      - name: Type check
        if: ${{ matrix.python-version == '3.13' }}
        run: uv run mypy src

      - name: Validate GitHub Actions workflows
        if: ${{ matrix.python-version == '3.13' }}
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 # 1.7.12
        with:
          args: -color

      - name: Test product behavior
        if: ${{ !cancelled() }}
        run: >-
          uv run coverage run -m pytest
          tests/unit
          tests/integration
          tests/acceptance/test_cli_workspace.py
          tests/contract/test_package_boundary.py
          --junitxml=test-results.xml

      - name: Verify the CI contract
        if: ${{ matrix.python-version == '3.13' && !cancelled() }}
        run: uv run pytest tests/contract/test_ci_workflow.py

      - name: Generate coverage evidence
        if: ${{ !cancelled() }}
        run: uv run coverage xml -o coverage.xml

      - name: Upload Python evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-${{ matrix.python-version }}-attempt-${{ github.run_attempt }}
          path: |
            test-results.xml
            coverage.xml
          if-no-files-found: warn
          retention-days: 5

  postgres-integration:
    name: PostgreSQL integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: foundry
          POSTGRES_PASSWORD: foundry
          POSTGRES_DB: foundry
        ports:
          - 5432
        options: >-
          --health-cmd "pg_isready -U foundry -d foundry"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out the tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure the synthetic database URL
        run: |
          echo "FOUNDRY_DATABASE_URL=postgresql+psycopg://foundry:foundry@localhost:${{ job.services.postgres.ports['5432'] }}/foundry" >> "$GITHUB_ENV"

      - name: Install uv and Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.CI_PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock
          # The Python matrix owns writes to this shared 3.13/lock cache key.
          save-cache: false
          prune-cache: true

      - name: Verify the dependency lock
        run: uv lock --check

      - name: Install development dependencies
        run: uv sync --locked --group dev

      - name: Apply migrations
        run: uv run alembic upgrade head

      - name: Detect migration drift
        run: uv run alembic check

      - name: Test the PostgreSQL CLI path
        run: >-
          uv run pytest tests/integration/test_postgresql_cli.py
          --junitxml=postgres-results.xml

      - name: Upload PostgreSQL evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: postgres-attempt-${{ github.run_attempt }}
          path: postgres-results.xml
          if-no-files-found: warn
          retention-days: 5

  image:
    uses: ./.github/workflows/reusable-image-delivery.yml
    with:
      publish: false
      candidate: validate-${{ github.run_id }}

  ci:
    name: ci
    needs: [python-quality, postgres-integration, image]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: ${{ always() }}
    permissions: {}

    steps:
      - name: Require every verification job
        env:
          PYTHON_QUALITY: ${{ needs.python-quality.result }}
          POSTGRES_INTEGRATION: ${{ needs.postgres-integration.result }}
          IMAGE: ${{ needs.image.result }}
        run: |
          echo "python-quality: $PYTHON_QUALITY"
          echo "postgres-integration: $POSTGRES_INTEGRATION"
          echo "image: $IMAGE"

          test "$PYTHON_QUALITY" = "success"
          test "$POSTGRES_INTEGRATION" = "success"
          test "$IMAGE" = "success"
