[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "startup-foundry"
version = "0.1.0"
description = "Evidence-backed venture operating system"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.19.0",
    "fastapi>=0.115,<1",
    "jinja2>=3.1,<4",
    # Alembic's template dependency: patched minimum for GHSA-5639-2j2p-m4mx.
    "Mako>=1.4.2,<2",
    "uvicorn>=0.30,<1",
    "psycopg[binary]>=3.3.4",
    "python-dotenv>=1.2.2",
    "sqlalchemy>=2.0.51",
]

[project.optional-dependencies]
# Once bootstrap is done, can probably remove
bootstrap = [
    "playwright>=1.58,<2",
    "mypy>=2.3.0",
    "pytest>=9.0.3,<10",
    "pytest-cov>=7.1.0",
    "httpx>=0.28,<1",
    "pyyaml>=6,<7",
    "ruff>=0.16.2",
]

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pytest>=9.0.3,<10",
    "pytest-cov>=7.1.0",
    "httpx>=0.28,<1",
    "pyyaml>=6,<7",
    "ruff>=0.16.2",
    "playwright>=1.58,<2",
]

[project.scripts]
foundry = "startup_foundry.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
startup_foundry = ["templates/*.html", "static/*.css", "static/*.js"]

[tool.setuptools.data-files]
"share/startup-foundry" = ["alembic.ini"]
"share/startup-foundry/alembic" = [
    "alembic/README",
    "alembic/env.py",
    "alembic/script.py.mako",
]
"share/startup-foundry/alembic/versions" = ["alembic/versions/*.py"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
extend-exclude = ["learner_archive"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[tool.coverage.run]
branch = true
source = ["startup_foundry"]

[tool.coverage.report]
show_missing = true
skip_covered = true
