[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "startup-foundry"
version = "0.0.1"
description = "Evidence-backed venture operating system"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.19.0",
    "python-dotenv>=1.2.2",
    "sqlalchemy>=2.0.51",
]

[project.optional-dependencies]
# Once bootstrap is done, can probably remove
bootstrap = [
    "mypy>=2.3.0",
    "pytest>=8,<9",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.2",
]

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pytest>=8,<9",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.2",
]

[project.scripts]
foundry = "startup_foundry.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
extend-exclude = ["learner_archive"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[tool.coverage.run]
branch = true
source = ["startup_foundry"]

[tool.coverage.report]
show_missing = true
skip_covered = true
