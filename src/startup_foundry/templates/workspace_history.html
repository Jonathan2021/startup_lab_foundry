<section class="panel form-panel"><h2>History</h2>{% for e in history['items'] %}<p><a href="{{ e.url }}">{{ e.type|pretty }} · {{ e.id }}</a> · {{ e.actor or 'actor in original record' }} · {{ e.time }}</p>{% else %}<p>No history.</p>{% endfor %}{% if history.offset>0 %}<a href="{{ workspace_link("history", [0,history.offset-history.limit]|max) }}">Previous</a>{% endif %}{% if history.offset+history.limit<history.total %}<a href="{{ workspace_link("history", history.offset+history.limit) }}">Next</a>{% endif %}</section>
