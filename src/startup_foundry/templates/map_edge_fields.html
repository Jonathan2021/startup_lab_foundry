<fieldset data-map-edge><legend>Relationship</legend><div class="field-grid"><label>From<select name="edge_source" data-saved="{{ edge.source }}"></select></label><label>To<select name="edge_target" data-saved="{{ edge.target }}"></select></label></div>
<label>Relationship<select name="edge_kind">{% for kind in ['contributes_to','tests','may_lead_to','depends_on','informs','supports','contradicts','revisits'] %}<option value="{{ kind }}" {{ 'selected' if edge.kind==kind }}>{{ kind|pretty }}</option>{% endfor %}</select></label>
<label>Condition (required for a possible branch)<textarea name="edge_condition" maxlength="2000">{{ edge.condition }}</textarea></label><label>Outcome<select name="edge_outcome"><option value="">Not a conditional branch</option>{% for outcome in ['supported','weakened','refuted','inconclusive','blocked','conflicting'] %}<option value="{{ outcome }}" {{ 'selected' if edge.outcome==outcome }}>{{ outcome|pretty }}</option>{% endfor %}</select></label><button class="secondary small" type="button" data-map-remove>Remove relationship</button></fieldset>
