<div class="pagination"><span>{{ page.total }} records · showing {{ page.offset + 1 if page.total and page.offset < page.total else 0 }}–{{ [page.offset + page.limit, page.total]|min }}</span><div>{% if page.offset > 0 %}<a href="{{ pagination_url([0,page.offset-page.limit]|max) }}">← Previous</a>{% endif %}{% if page.offset + page.limit < page.total %}<a href="{{ pagination_url(page.offset+page.limit) }}">Next →</a>{% endif %}</div></div>
